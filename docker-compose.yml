services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-architecture_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-architecture_lab}
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-architecture_lab} -d $${POSTGRES_DB:-architecture_lab}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  market-ingestor:
    build:
      context: .
      dockerfile: Dockerfile
    image: market-data-architecture-lab:local
    command: ["node", "dist/ingestor.js"]
    environment:
      NODE_ENV: production
      LOG_COMPONENT: market-ingestor
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-architecture_lab}:${POSTGRES_PASSWORD:-1234}@timescaledb:5432/${POSTGRES_DB:-architecture_lab}?schema=market}
      REDIS_URL: redis://redis:6379
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:?TWELVE_DATA_API_KEY is required}
      TWELVE_DATA_WS_URL: ${TWELVE_DATA_WS_URL:-wss://ws.twelvedata.com/v1/quotes/price}
      STREAM_SYMBOLS: ${STREAM_SYMBOLS:-BTC/USD}
      ENABLE_HISTORICAL_BACKFILL: ${ENABLE_HISTORICAL_BACKFILL:-false}
      LEADER_ELECTION_LOCK_KEY: ${LEADER_ELECTION_LOCK_KEY:-424242}
      LEADER_ELECTION_RETRY_MS: ${LEADER_ELECTION_RETRY_MS:-1000}
      KAFKA_BROKERS: kafka:19092
      KAFKA_RAW_TICKS_TOPIC: market.raw-ticks
      KAFKA_CLIENT_ID: market-feed-ingestor
      CANDLE_PROCESSOR_SYMBOLS: ${CANDLE_PROCESSOR_SYMBOLS:-BTC/USD}
      INGESTOR_METRICS_PORT: 9464
    expose:
      - "9464"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  chart-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: market-data-architecture-lab:local
    command: ["node", "dist/server.js"]
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      NODE_ENV: production
      LOG_COMPONENT: chart-server
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-architecture_lab}:${POSTGRES_PASSWORD:-1234}@timescaledb:5432/${POSTGRES_DB:-architecture_lab}?schema=market}
      REDIS_URL: redis://redis:6379
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  candle-processor:
    build:
      context: .
      dockerfile: Dockerfile
    image: market-data-architecture-lab:local
    command: ["node", "dist/candle-processor.js"]
    environment:
      NODE_ENV: production
      LOG_COMPONENT: candle-processor
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-architecture_lab}:${POSTGRES_PASSWORD:-1234}@timescaledb:5432/${POSTGRES_DB:-architecture_lab}?schema=market}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:19092
      KAFKA_RAW_TICKS_TOPIC: market.raw-ticks
      KAFKA_CANDLE_CONSUMER_GROUP: candle-processor-v1
      KAFKA_CANDLE_CONSUMER_CLIENT_ID: candle-processor
      STREAM_SYMBOLS: ${STREAM_SYMBOLS:-BTC/USD}
      CANDLE_PROCESSOR_SYMBOLS: ${CANDLE_PROCESSOR_SYMBOLS:-BTC/USD}
      CANDLE_PROCESSOR_METRICS_PORT: 9465
    expose:
      - "9465"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - market-ingestor
      - candle-processor
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: >-
        PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:19092
        --create
        --if-not-exists
        --topic market.raw-ticks
        --partitions 1
        --replication-factor 1
    restart: "no"

volumes:
  timescale-data:
  redis-data:
  kafka-data:
  prometheus-data:
